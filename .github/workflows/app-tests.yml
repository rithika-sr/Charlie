name: App tests

# Web app tests (Flask API + frontend modules). External services are mocked, so
# this needs no MBTA, OpenAI, Google or cloud credentials and runs on every PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Python API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API_Service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: API_Service/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run pytest (no API keys)
        env:
          MBTA_API_KEY: ""
          OPENAI_API_KEY: ""
          GOOGLE_MAPS_API_KEY: ""
        run: python -m pytest -q

  frontend:
    name: Frontend module tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API_Service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run node --test
        run: node --test tests/js/*.test.mjs
