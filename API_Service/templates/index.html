<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090D14">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Charlie — live MBTA arrivals, service alerts, a live train map, trip planning and an AI transit assistant for Boston.">
  <title>Charlie — Boston transit, live</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111827'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23F8FAFC' stroke-width='2.5'/%3E%3Cpath d='M11 12h10M16 12v9' stroke='%23F8FAFC' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
</head>
<body data-route="overview">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    <!-- Sidebar (tablet + desktop) -->
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#/overview" aria-label="Charlie home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32"><rect width="32" height="32" rx="9" fill="#1B2535"/><circle cx="16" cy="16" r="9" fill="none" stroke="#F8FAFC" stroke-width="2.4"/><path d="M11 12h10M16 12v9" stroke="#F8FAFC" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        <span class="brand__text"><span class="brand__name">Charlie</span><span class="brand__tag">Boston in motion</span></span>
      </a>
      <nav class="nav">
        <p class="nav__group">Explore</p>
        <a class="nav__item" data-nav="overview" href="#/overview" title="Overview"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Overview</span></a>
        <a class="nav__item" data-nav="map" href="#/map" title="Live Map"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 2.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>Live Map</span></a>
        <a class="nav__item" data-nav="trip" href="#/trip" title="Trip Planner"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg><span>Trip Planner</span></a>
        <a class="nav__item" data-nav="stations" href="#/stations" title="Stations"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Stations</span></a>
        <p class="nav__group">Network</p>
        <a class="nav__item" data-nav="lines" href="#/lines" title="Lines &amp; Routes"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Lines &amp; Routes</span></a>
        <a class="nav__item" data-nav="alerts" href="#/alerts" title="Service Alerts"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><span>Service Alerts</span><span class="badge" data-alert-count hidden></span></a>
        <p class="nav__group">Assistant</p>
        <a class="nav__item" data-nav="ai" href="#/ai" title="Charlie AI"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Charlie AI</span></a>
      </nav>
      <p class="sidebar__foot">Live data from the <a href="https://www.mbta.com/developers/v3-api" target="_blank" rel="noopener">MBTA V3 API</a>. Not affiliated with the MBTA.</p>
    </aside>

    <div class="workspace">
      <!-- Command bar -->
      <header class="command">
        <a class="command__brand" href="#/overview" aria-label="Charlie home">
          <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1B2535"/><circle cx="16" cy="16" r="9" fill="none" stroke="#F8FAFC" stroke-width="2.4"/><path d="M11 12h10M16 12v9" stroke="#F8FAFC" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span>Charlie</span>
        </a>
        <div class="command__search combo" role="search">
          <svg class="icon combo__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="sr-only" for="global-search">Search stations and routes</label>
          <input id="global-search" class="input input--search" type="search" placeholder="Search stations and routes" />
          <kbd class="kbd" aria-hidden="true">/</kbd>
          <button class="icon-btn command__search-close" data-close-search aria-label="Close search"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="command__right">
          <span class="fresh" data-fresh role="status" aria-live="off"></span>
          <button class="icon-btn command__mobile-only" data-open-search aria-label="Search stations and routes"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          <a class="icon-btn command__mobile-only command__alerts" href="#/alerts" data-nav="alerts" aria-label="Service alerts"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg><span class="badge badge--dot" data-alert-count hidden></span></a>
          <button class="btn btn--secondary btn--sm command__locate" data-locate-global aria-label="Use my location"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg><span class="command__locate-label">Near me</span></button>
        </div>
      </header>

      <main id="main" class="main" tabindex="-1">
        <div id="view" class="view"></div>
        <div id="map-view" class="map-view" hidden></div>
      </main>
    </div>

    <aside id="detail-panel" class="panel" hidden role="dialog" aria-modal="false"></aside>
  </div>

  <!-- Bottom navigation (mobile) -->
  <nav class="tabbar" aria-label="Primary">
    <a class="tabbar__item" data-nav="overview" href="#/overview"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Home</span></a>
    <a class="tabbar__item" data-nav="map" href="#/map"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 2.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>Map</span></a>
    <a class="tabbar__item" data-nav="trip" href="#/trip"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg><span>Plan</span></a>
    <a class="tabbar__item" data-nav="stations" href="#/stations"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Stations</span></a>
    <a class="tabbar__item" data-nav="lines" href="#/lines"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>Lines</span></a>
    <a class="tabbar__item" data-nav="ai" href="#/ai"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg><span>Charlie</span></a>
  </nav>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Charlie needs JavaScript to show live MBTA data.</p></noscript>
  <script type="importmap">{{ import_map | tojson }}</script>
  <script type="module" src="/static/js/main.js?v={{ asset_version }}"></script>
</body>
</html>
